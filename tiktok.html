<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>ClipFeed</title>
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bg: #000;
  --surface: #121212;
  --surface-2: #1e1e1e;
  --surface-3: #2a2a2a;
  --text: #fff;
  --text-dim: rgba(255, 255, 255, .72);
  --text-mute: rgba(255, 255, 255, .5);
  --accent: #fe2c55;
  --accent-2: #25f4ee;
  --like: #fe2c55;
  --border: rgba(255, 255, 255, .12);
  --nav-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --app-h: 100vh;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@supports (height: 100dvh) { :root { --app-h: 100dvh; } }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =========================================================
   APP SHELL (Mobile: Vollbild, Desktop: zentrierte 9:16-Spalte)
   ========================================================= */
.backdrop-blur {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(1200px 800px at 20% 10%, rgba(254, 44, 85, .18), transparent 60%),
              radial-gradient(1000px 700px at 80% 90%, rgba(37, 244, 238, .14), transparent 60%), #000;
}
.app {
  position: relative; z-index: 1;
  height: var(--app-h); width: 100%;
  margin: 0 auto; display: flex; flex-direction: column;
  background: #000; overflow: hidden;
}
@media (min-width: 700px) {
  .app {
    width: min(100vw, calc((var(--app-h) - var(--nav-h)) * 9 / 16));
    box-shadow: 0 0 0 1px var(--border), 0 30px 80px rgba(0, 0, 0, .6);
  }
}

/* Topbar */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  padding: calc(10px + var(--safe-t)) 14px 10px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to bottom, rgba(0, 0, 0, .55), transparent);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { font-weight: 800; letter-spacing: -.3px; font-size: 18px; display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: -3px 0 0 var(--accent-2); }
.tabs { display: flex; gap: 18px; font-weight: 700; font-size: 16px; }
.tab { color: var(--text-mute); position: relative; padding: 4px 0; transition: color .2s; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.tab.active { color: var(--text); }
.tab.active::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 24px; height: 3px; border-radius: 2px; background: #fff; transform: translateX(-50%); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; transition: background .2s, transform .15s; }
.icon-btn:hover { background: rgba(255, 255, 255, .1); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 24px; height: 24px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }

/* =========================================================
   FEED (Snap-Scrolling)
   ========================================================= */
.feed {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  overscroll-behavior-y: contain;
}
.feed::-webkit-scrollbar { display: none; }
.slide {
  position: relative; height: 100%; width: 100%;
  scroll-snap-align: start; scroll-snap-stop: always;
  overflow: hidden; background: #000;
  contain: strict;
}
.slide video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; background: #000;
}
.slide.fit-contain video { object-fit: contain; }
.tap-layer { position: absolute; inset: 0; z-index: 2; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.shade {
  position: absolute; inset: auto 0 0 0; height: 45%; z-index: 3; pointer-events: none;
  background: linear-gradient(to top, rgba(0, 0, 0, .7), rgba(0, 0, 0, .25) 55%, transparent);
}

/* Lade- und Fehlerzustand */
.spinner {
  position: absolute; left: 50%; top: 50%; z-index: 4; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  pointer-events: none; opacity: 0; transition: opacity .2s;
}
.spinner::before, .spinner::after {
  content: ""; position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%;
  animation: orbit 1s var(--ease) infinite;
}
.spinner::before { left: 4px; background: var(--accent-2); }
.spinner::after { right: 4px; background: var(--accent); animation-delay: -.5s; }
.slide.loading .spinner { opacity: 1; }
@keyframes orbit { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(var(--dx, 12px)) scale(.7); } }
.spinner::after { --dx: -12px; }

.error-box {
  position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 24px; color: var(--text-dim); font-size: 14px; pointer-events: none;
}
.error-box svg { width: 48px; height: 48px; opacity: .7; }
.slide.error .error-box { display: flex; }
.slide.error .spinner { opacity: 0; }

/* Zentrales Feedback (Mute / Pause) */
.center-flash {
  position: absolute; left: 50%; top: 50%; z-index: 5; width: 76px; height: 76px; margin: -38px 0 0 -38px;
  border-radius: 50%; background: rgba(0, 0, 0, .45); display: grid; place-items: center;
  opacity: 0; transform: scale(.6); pointer-events: none;
}
.center-flash svg { width: 38px; height: 38px; }
.center-flash.show { animation: flash .7s var(--ease) forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }
.paused-badge {
  position: absolute; left: 50%; top: 50%; z-index: 5; width: 70px; height: 70px; margin: -35px 0 0 -35px;
  display: grid; place-items: center; opacity: 0; transform: scale(1.3); transition: opacity .2s, transform .2s var(--ease); pointer-events: none;
}
.paused-badge svg { width: 64px; height: 64px; opacity: .85; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
.slide.paused .paused-badge { opacity: 1; transform: scale(1); }

/* Doppeltipp-Herzen */
.burst {
  position: absolute; z-index: 6; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none;
  animation: burst .9s var(--ease) forwards;
}
.burst { color: var(--like); }
.burst svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 12px rgba(254, 44, 85, .5)); }
@keyframes burst {
  0% { opacity: 0; transform: scale(.3) rotate(var(--r, 0deg)); }
  15% { opacity: 1; transform: scale(1.2) rotate(var(--r, 0deg)); }
  30% { transform: scale(.95) rotate(var(--r, 0deg)); }
  70% { opacity: 1; transform: scale(1) translateY(-10px) rotate(var(--r, 0deg)); }
  100% { opacity: 0; transform: scale(1.4) translateY(-80px) rotate(var(--r, 0deg)); }
}

/* =========================================================
   OVERLAY RECHTS (Aktionen)
   ========================================================= */
.actions {
  position: absolute; right: 8px; bottom: 18px; z-index: 7;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.avatar-wrap { position: relative; margin-bottom: 8px; }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 18px; text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.follow-btn {
  position: absolute; left: 50%; bottom: -10px; width: 22px; height: 22px; margin-left: -11px;
  border-radius: 50%; background: var(--accent); display: grid; place-items: center;
  transition: transform .3s var(--ease), background .3s;
}
.follow-btn svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
.follow-btn.on { background: #fff; color: var(--accent); }
.follow-btn.on svg { transform: rotate(360deg); }
.follow-btn:active { transform: scale(.85); }
.act { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.act-icon {
  width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%;
  transition: transform .15s var(--ease);
}
.act:active .act-icon { transform: scale(.85); }
.act-icon svg { width: 36px; height: 36px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.45)); }
.act.like .act-icon svg path { transition: fill .2s; }
.act.like.on .act-icon svg path { fill: var(--like); }
.act.like.pop .act-icon { animation: pop .45s var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(.7); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
.act.save.on .act-icon svg path { fill: #ffc107; }
.act.save.pop .act-icon { animation: pop .45s var(--ease); }

/* Rotierende Musik-Disk */
.disc {
  width: 46px; height: 46px; border-radius: 50%; margin-top: 4px; position: relative;
  background: radial-gradient(circle, #111 0 30%, #2b2b2b 31% 34%, #111 35% 52%, #2b2b2b 53% 56%, #161616 57%);
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  animation: spin 5s linear infinite; animation-play-state: paused;
}
.disc-inner { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
.slide.playing .disc { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.notes { position: absolute; right: 44px; bottom: 30px; pointer-events: none; }
.note {
  position: absolute; font-size: 14px; opacity: 0; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  animation: note 3s ease-in infinite; animation-play-state: paused;
}
.note:nth-child(2) { animation-delay: 1s; }
.note:nth-child(3) { animation-delay: 2s; }
.slide.playing .note { animation-play-state: running; }
@keyframes note {
  0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.6); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translate(-26px, -60px) rotate(-25deg) scale(1.1); }
}

/* =========================================================
   OVERLAY UNTEN LINKS (Infos)
   ========================================================= */
.info {
  position: absolute; left: 12px; right: 80px; bottom: 18px; z-index: 7;
  display: flex; flex-direction: column; gap: 7px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
}
.username { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.18); text-shadow: none; }
.desc {
  font-size: 14px; line-height: 1.35; color: #fff; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer;
}
.desc.expanded { -webkit-line-clamp: unset; display: block; max-height: 30vh; overflow-y: auto; }
.desc .tag { font-weight: 700; }
.music { display: flex; align-items: center; gap: 6px; font-size: 13px; overflow: hidden; }
.music svg { width: 15px; height: 15px; flex: none; }
.marquee { overflow: hidden; white-space: nowrap; max-width: 70%; mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); }
.marquee span { display: inline-block; animation: marquee 10s linear infinite; animation-play-state: paused; }
.marquee span::after { content: attr(data-text); padding-left: 2.5em; }
.marquee span::before { content: ""; padding-left: 2.5em; }
.slide.playing .marquee span { animation-play-state: running; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* Fortschrittsbalken (anklickbar / ziehbar) */
.progress {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; height: 16px;
  display: flex; align-items: flex-end; cursor: pointer; touch-action: none;
}
.progress-track { position: relative; width: 100%; height: 2px; background: rgba(255,255,255,.25); transition: height .15s; }
.progress-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255,255,255,.9); }
.progress:hover .progress-track, .progress.drag .progress-track { height: 5px; }
.progress-fill::after {
  content: ""; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
  background: #fff; transform: scale(0); transition: transform .15s;
}
.progress:hover .progress-fill::after, .progress.drag .progress-fill::after { transform: scale(1); }
.time-tip {
  position: absolute; left: 50%; bottom: 70px; z-index: 9; transform: translateX(-50%);
  font-size: 22px; font-weight: 800; letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.7);
  opacity: 0; transition: opacity .15s; pointer-events: none; font-variant-numeric: tabular-nums;
}
.slide.seeking .time-tip { opacity: 1; }
.slide.seeking .info, .slide.seeking .actions { opacity: 0; transition: opacity .15s; }

/* Leerer Feed */
.empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  color: var(--text-dim); text-align: center; padding: 30px;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */
.bottom-nav {
  flex: none; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: #000; border-top: 1px solid rgba(255,255,255,.08);
  display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; z-index: 30;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--text-mute); transition: color .2s; height: 100%; justify-content: center; }
.nav-item svg { width: 26px; height: 26px; }
.nav-item.active { color: #fff; }
.upload-btn { justify-self: center; position: relative; width: 48px; height: 32px; }
.upload-btn::before, .upload-btn::after { content: ""; position: absolute; top: 0; width: 40px; height: 100%; border-radius: 9px; }
.upload-btn::before { left: 0; background: var(--accent-2); }
.upload-btn::after { right: 0; background: var(--accent); }
.upload-btn span {
  position: absolute; inset: 0 4px; z-index: 1; background: #fff; border-radius: 8px; color: #000;
  display: grid; place-items: center; transition: transform .15s;
}
.upload-btn:active span { transform: scale(.92); }
.upload-btn svg { width: 20px; height: 20px; }

/* Desktop: Pfeil-Navigation */
.desk-nav { display: none; }
@media (min-width: 700px) and (hover: hover) {
  .desk-nav {
    position: fixed; top: 50%;
    left: min(calc(100vw - 68px), calc(50% + min(50vw, (var(--app-h) - var(--nav-h)) * 9 / 32) + 20px));
    transform: translateY(-50%); z-index: 40; display: flex; flex-direction: column; gap: 14px;
  }
  .desk-nav button { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; transition: background .2s, opacity .2s; }
  .desk-nav button:hover { background: var(--surface-3); }
  .desk-nav button:disabled { opacity: .3; cursor: default; }
  .desk-nav svg { width: 22px; height: 22px; }
}
.hint { display: none; }
@media (min-width: 1000px) and (hover: hover) {
  .hint {
    display: block; position: fixed; left: 24px; bottom: 24px; z-index: 40; font-size: 12px; color: var(--text-mute); line-height: 1.8;
  }
  .hint kbd { display: inline-block; min-width: 22px; padding: 0 6px; margin-right: 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); text-align: center; font-family: inherit; color: var(--text-dim); }
}

/* =========================================================
   SHEETS (Kommentare, Upload, Profil)
   ========================================================= */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .5);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 101;
  width: 100%; max-width: 560px; max-height: calc(var(--app-h) * .78);
  background: var(--surface); border-radius: 16px 16px 0 0;
  transform: translate(-50%, 105%); transition: transform .38s var(--ease);
  display: flex; flex-direction: column; padding-bottom: var(--safe-b);
  box-shadow: 0 -10px 40px rgba(0,0,0,.5);
}
.sheet.open { transform: translate(-50%, 0); }
.sheet.dragging { transition: none; }
.sheet.tall { height: calc(var(--app-h) * .72); }
.sheet-head { position: relative; flex: none; padding: 14px 48px 12px; text-align: center; font-weight: 700; font-size: 15px; border-bottom: 1px solid var(--border); touch-action: none; cursor: grab; }
.sheet-head::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(255,255,255,.25); }
.sheet-close { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.sheet-close:hover { background: var(--surface-2); }
.sheet-close svg { width: 20px; height: 20px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 16px; }

/* Kommentare */
.c-list { list-style: none; display: flex; flex-direction: column; }
.c-item { display: flex; gap: 12px; padding: 12px 0; animation: cin .35s var(--ease); }
@keyframes cin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.c-avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; text-transform: uppercase; }
.c-main { flex: 1; min-width: 0; }
.c-name { font-size: 13px; font-weight: 600; color: var(--text-mute); display: flex; align-items: center; gap: 6px; }
.c-name .me { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--accent); color: #fff; }
.c-text { font-size: 15px; line-height: 1.4; margin: 3px 0 4px; word-break: break-word; white-space: pre-wrap; }
.c-meta { font-size: 12px; color: var(--text-mute); display: flex; gap: 14px; }
.c-meta button { color: var(--text-mute); font-weight: 600; font-size: 12px; }
.c-meta button:hover { color: #fff; }
.c-like { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--text-mute); padding-top: 6px; }
.c-like svg { width: 18px; height: 18px; }
.c-like.on svg path { fill: var(--like); }
.c-like.on { color: var(--like); }
.c-empty { text-align: center; color: var(--text-mute); padding: 40px 10px; font-size: 14px; }
.c-form { flex: none; display: flex; gap: 10px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); }
.c-input {
  flex: 1; min-height: 40px; max-height: 120px; resize: none; padding: 10px 14px; border-radius: 20px;
  background: var(--surface-2); border: 1px solid transparent; outline: none; font-size: 15px; line-height: 1.3; transition: border-color .2s;
}
.c-input:focus { border-color: rgba(255,255,255,.25); }
.c-send { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; transition: opacity .2s, transform .15s; }
.c-send:disabled { opacity: .35; cursor: default; }
.c-send:not(:disabled):active { transform: scale(.9); }
.c-send svg { width: 18px; height: 18px; }

/* Upload */
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  min-height: 190px; border: 2px dashed rgba(255,255,255,.2); border-radius: 14px; padding: 20px; cursor: pointer;
  color: var(--text-dim); transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: rgba(254, 44, 85, .06); }
.drop svg { width: 44px; height: 44px; }
.drop strong { color: #fff; font-size: 16px; }
.drop small { color: var(--text-mute); }
.preview { display: none; position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 9 / 16; max-height: 42vh; margin: 0 auto; }
.preview video { width: 100%; height: 100%; object-fit: contain; display: block; }
.preview-change { position: absolute; right: 8px; top: 8px; padding: 6px 12px; border-radius: 16px; background: rgba(0,0,0,.6); font-size: 13px; font-weight: 600; }
.has-file .drop { display: none; }
.has-file .preview { display: block; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-dim); display: flex; justify-content: space-between; }
.field label span { color: var(--text-mute); font-weight: 400; }
.field input, .field textarea {
  width: 100%; padding: 11px 13px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; outline: none; font-size: 15px; transition: border-color .2s;
}
.field textarea { resize: vertical; min-height: 70px; max-height: 180px; }
.field input:focus, .field textarea:focus { border-color: rgba(255,255,255,.25); }
.file-meta { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-mute); }
.primary {

.grid-item .g-likes { position: absolute; left: 6px; bottom: 5px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 3px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.grid-item .g-likes svg { width: 13px; height: 13px; }
.grid-item .g-del { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; }
.grid-item .g-del svg { width: 15px; height: 15px; }
.grid-item .g-del:hover { background: var(--accent); }
.grid-empty { grid-column: 1 / -1; text-align: center; color: var(--text-mute); padding: 30px 10px; font-size: 14px; line-height: 1.5; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-dim); margin: 6px 0 10px; display: flex; align-items: center; gap: 6px; }
.storage-info { margin-top: 16px; font-size: 12px; color: var(--text-mute); text-align: center; line-height: 1.5; }
.danger { margin-top: 10px; width: 100%; padding: 11px; border-radius: 10px; background: var(--surface-2); color: #ff6b81; font-weight: 600; font-size: 14px; }
.danger:hover { background: var(--surface-3); }

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Bestätigungsdialog */
.confirm {

.confirm.open { display: flex; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.confirm-box { width: 100%; max-width: 320px; background: var(--surface-2); border-radius: 14px; overflow: hidden; text-align: center; animation: zoomin .25s var(--ease); }
@keyframes zoomin { from { transform: scale(.9); } }
.confirm-box p { padding: 22px 20px; font-size: 15px; line-height: 1.4; }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.confirm-actions button { padding: 14px; font-weight: 600; }
.confirm-actions button + button { border-left: 1px solid var(--border); color: #ff6b81; }

  const LS_KEY = 'clipfeed.v1';

    state: { likes: {}, saves: {}, follows: {}, comments: {}, commentLikes: {}, shares: {}, profile: { name: 'du' }, muted: true },

        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function tx(mode, fn) {
      const db = await open();
      return new Promise((resolve, reject) => {
        const t = db.transaction(STORE, mode);
        const result = fn(t.objectStore(STORE));
        t.oncomplete = () => resolve(result && 'result' in result ? result.result : undefined);
        t.onerror = () => reject(t.error);
        t.onabort = () => reject(t.error || new Error('Transaktion abgebrochen'));
      });
    }

    return {
      available: () => open().then(() => true, () => false),
      getAll: () => tx('readonly', s => s.getAll()),
      put: rec => tx('readwrite', s => s.put(rec)),
      remove: id => tx('readwrite', s => s.delete(id)),
      clear: () => tx('readwrite', s => s.clear())
    };
  })();

  /* =========================================================
     HELFER
     ========================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  function formatCount(n) {
    if (n < 1000) return String(n);
    const fmt = (v, s) => (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10).toString().replace('.', ',') + s;
    if (n < 1e6) return fmt(n / 1e3, 'K');
    if (n < 1e9) return fmt(n / 1e6, 'M');
    return fmt(n / 1e9, 'B');
  }

  function timeAgo(ts) {
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'gerade eben';
    const m = s / 60; if (m < 60) return `vor ${Math.floor(m)} Min.`;
    const h = m / 60; if (h < 24) return `vor ${Math.floor(h)} Std.`;
    const d = h / 24; if (d < 7) return `vor ${Math.floor(d)} T.`;
    return new Date(ts).toLocaleDateString('de-DE');
  }

  function formatTime(sec) {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function formatBytes(b) {
    if (b < 1024 ** 2) return (b / 1024).toFixed(0) + ' KB';
    if (b < 1024 ** 3) return (b / 1024 ** 2).toFixed(1).replace('.', ',') + ' MB';
    return (b / 1024 ** 3).toFixed(2).replace('.', ',') + ' GB';
  }

  // Deterministische Farbverläufe für Avatare, keine externen Bilder nötig.
  function avatarStyle(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const a = h % 360, b = (a + 40 + (h >> 8) % 80) % 360;
    return `background:linear-gradient(135deg,hsl(${a} 75% 55%),hsl(${b} 80% 45%));color:#fff`;
  }
  function paintAvatar(node, name) {
    node.setAttribute('style', avatarStyle(name));
    node.textContent = (name.replace(/[^\p{L}\p{N}]/gu, '')[0] || '?');
  }

  // Beschreibung sicher rendern (kein innerHTML mit Nutzertext) und Hashtags hervorheben.
  function renderRichText(node, text) {
    node.textContent = '';
    const parts = text.split(/(#[\p{L}\p{N}_]+|@[\p{L}\p{N}_.]+)/gu);
    for (const part of parts) {
      if (!part) continue;
      if (/^[#@]/.test(part)) { const b = el('span', 'tag'); b.textContent = part; node.append(b); }
      else node.append(document.createTextNode(part));
    }
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function confirmDialog(text, yesLabel = 'Löschen') {
    return new Promise(resolve => {
      const box = $('#confirm');
      $('#confirmText').textContent = text;
      $('#confirmYes').textContent = yesLabel;
      box.classList.add('open');
      const done = val => {
        box.classList.remove('open');
        $('#confirmYes').onclick = $('#confirmNo').onclick = box.onclick = null;
        resolve(val);
      };
      $('#confirmYes').onclick = () => done(true);
      $('#confirmNo').onclick = () => done(false);
      box.onclick = e => { if (e.target === box) done(false); };
      $('#confirmNo').focus();
    });
  }

  /* =========================================================
     APP-ZUSTAND
     ========================================================= */
  const feedEl = $('#feed');
  let allVideos = [];        // Seeds + Uploads
  let visibleVideos = [];    // gefiltert ("Für dich" / "Folge ich")
  let slides = [];           // DOM-Knoten parallel zu visibleVideos
  let activeIndex = -1;
  let filter = 'all';
  let rafId = 0;
  let observer = null;
  const objectUrls = new Map(); // id -> blob URL (wird beim Löschen freigegeben)
  const PRELOAD_RADIUS = 1;     // Nachbarn, die vorgeladen werden
  const KEEP_RADIUS = 2;        // außerhalb davon wird der Speicher freigegeben

  const isLiked = v => !!Store.state.likes[v.id];
  const likeCount = v => v.likes + (isLiked(v) ? 1 : 0);
  const userComments = v => Store.state.comments[v.id] || [];
  const commentCount = v => v.comments.length + userComments(v).length;
  const shareCount = v => v.shares + (Store.state.shares[v.id] || 0);
  const isFollowing = user => !!Store.state.follows[user];
  const myName = () => Store.state.profile.name || 'du';

  function uploadToVideo(rec) {
    let url = objectUrls.get(rec.id);
    if (!url) { url = URL.createObjectURL(rec.blob); objectUrls.set(rec.id, url); }
    return {
      id: rec.id, user: myName(), verified: false, own: true,
      desc: rec.desc || '', music: rec.music || `Originalton – ${myName()}`,
      likes: 0, shares: 0, sources: [url], comments: [], createdAt: rec.createdAt,
      blob: rec.blob, fileName: rec.name
    };
  }

  /* =========================================================
     SLIDE-RENDERING
     ========================================================= */
  function createSlide(v, index) {
    const s = el('article', 'slide loading');
    s.dataset.index = index;
    s.dataset.id = v.id;
    s.setAttribute('aria-label', `Video von @${v.user}`);

    const video = el('video');
    video.loop = true;
    video.muted = Store.state.muted;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.preload = 'none';
    video.disablePictureInPicture = true;
    video.dataset.srcIndex = '-1';

    s.append(
      video,
      el('div', 'spinner'),
      el('div', 'error-box', `${ICON.broken}<div>Video konnte nicht geladen werden.<br>Prüfe deine Internetverbindung.</div>`),
      el('div', 'tap-layer'),
      el('div', 'shade'),
      el('div', 'center-flash'),
      el('div', 'paused-badge', ICON.play),
      el('div', 'time-tip')
    );

    // Rechte Aktionsleiste
    const actions = el('div', 'actions');
    const avWrap = el('div', 'avatar-wrap');
    const av = el('div', 'avatar');
    paintAvatar(av, v.user);
    avWrap.append(av);
    if (!v.own) {
      const fb = el('button', 'follow-btn' + (isFollowing(v.user) ? ' on' : ''), isFollowing(v.user) ? ICON.check : ICON.plus);
      fb.dataset.action = 'follow';
      fb.setAttribute('aria-label', isFollowing(v.user) ? `@${v.user} entfolgen` : `@${v.user} folgen`);
      avWrap.append(fb);
    }
    actions.append(avWrap);

    const mkAct = (cls, icon, count, label) => {
      const b = el('button', `act ${cls}`);
      b.dataset.action = cls;
      b.setAttribute('aria-label', label);
      b.append(el('span', 'act-icon', icon));
      const c = el('span', 'act-count'); c.textContent = count;
      b.append(c);
      return b;
    };
    const likeBtn = mkAct('like', ICON.heart, formatCount(likeCount(v)), 'Gefällt mir');
    if (isLiked(v)) likeBtn.classList.add('on');
    likeBtn.setAttribute('aria-pressed', isLiked(v));
    const saveBtn = mkAct('save', ICON.bookmark, Store.state.saves[v.id] ? 'Gespeichert' : 'Speichern', 'Speichern');
    if (Store.state.saves[v.id]) saveBtn.classList.add('on');
    actions.append(
      likeBtn,
      mkAct('comment', ICON.comment, formatCount(commentCount(v)), 'Kommentare'),
      saveBtn,
      mkAct('share', ICON.share, formatCount(shareCount(v)), 'Teilen')
    );
    const disc = el('div', 'disc');
    const discInner = el('div', 'disc-inner');
    paintAvatar(discInner, v.user);
    disc.append(discInner);
    actions.append(disc);
    s.append(actions);

    const notes = el('div', 'notes', '<span class="note">♪</span><span class="note">♫</span><span class="note">♪</span>');
    s.append(notes);

    // Info unten links
    const info = el('div', 'info');
    const uname = el('div', 'username');
    uname.textContent = '@' + v.user;
    if (v.verified) uname.append(el('span', 'badge', '✓'));
    if (v.own) { const b = el('span', 'badge'); b.textContent = 'Du'; uname.append(b); }
    const desc = el('div', 'desc');
    renderRichText(desc, v.desc || ' ');
    desc.dataset.action = 'expand';
    const music = el('div', 'music', ICON.music);
    const mq = el('div', 'marquee');
    const mqText = el('span');
    mqText.textContent = v.music;
    mqText.dataset.text = v.music;
    mq.append(mqText);
    music.append(mq);
    info.append(uname, desc, music);
    s.append(info);

    const prog = el('div', 'progress', '<div class="progress-track"><div class="progress-fill"></div></div>');
    prog.setAttribute('role', 'slider');
    prog.setAttribute('aria-label', 'Wiedergabeposition');
    s.append(prog);

    wireVideoEvents(s, video, v);
    wireTapLayer(s, $('.tap-layer', s));
    wireProgress(s, prog, video);
    return s;
  }

  function wireVideoEvents(slide, video, v) {
    video.addEventListener('waiting', () => slide.classList.add('loading'));
    video.addEventListener('canplay', () => slide.classList.remove('loading', 'error'));
    video.addEventListener('playing', () => { slide.classList.add('playing'); slide.classList.remove('loading'); });
    video.addEventListener('pause', () => slide.classList.remove('playing'));
    video.addEventListener('loadedmetadata', () => {
      // Querformat-Videos nicht beschneiden, sondern komplett zeigen.
      slide.classList.toggle('fit-contain', video.videoWidth > video.videoHeight * 1.05);
    });
    video.addEventListener('error', () => {
      if (!video.getAttribute('src')) return; // bewusst entladen
      tryNextSource(slide, video, v);
    });
  }

  function tryNextSource(slide, video, v) {
    const next = Number(video.dataset.srcIndex) + 1;
    if (next >= v.sources.length) {
      slide.classList.remove('loading', 'playing');
      slide.classList.add('error');
      return;
    }
    video.dataset.srcIndex = String(next);
    video.src = v.sources[next];
    video.load();
    if (Number(slide.dataset.index) === activeIndex) safePlay(video, slide);
  }

  function loadSlide(i) {
    const s = slides[i];
    if (!s) return;
    const video = $('video', s);
    if (video.getAttribute('src')) return;
    const v = visibleVideos[i];
    video.dataset.srcIndex = '0';
    video.preload = 'auto';
    video.src = v.sources[0];
    video.load();
  }

  function unloadSlide(i) {
    const s = slides[i];
    if (!s) return;
    const video = $('video', s);
    if (!video.getAttribute('src')) return;
    video.pause();
    video.removeAttribute('src');
    video.load(); // gibt Puffer/Decoder frei
    video.dataset.srcIndex = '-1';
    s.classList.add('loading');
    s.classList.remove('playing', 'paused', 'error');
  }

  function safePlay(video, slide) {
    video.muted = Store.state.muted;
    const p = video.play();
    if (p && p.catch) {
      p.catch(err => {
        if (err.name === 'NotAllowedError' && !video.muted) {
          // Browser blockiert Autoplay mit Ton → stumm starten.
          Store.state.muted = true; Store.save();
          applyMute(false);
          video.play().catch(() => {});
          toast('Tippe auf das Video, um den Ton einzuschalten');
        } else if (err.name !== 'AbortError') {
          console.warn('Wiedergabe fehlgeschlagen:', err);
        }
      });
    }
    slide.classList.remove('paused');
  }

  /* =========================================================
     AKTIVES VIDEO / OBSERVER
     ========================================================= */
  function setActive(i) {
    if (i === activeIndex || !slides[i]) return;
    const prev = slides[activeIndex];
    if (prev) {
      const pv = $('video', prev);
      pv.pause();
      prev.classList.remove('paused');
    }
    activeIndex = i;

    for (let j = 0; j < slides.length; j++) {
      const d = Math.abs(j - i);
      if (d <= PRELOAD_RADIUS) loadSlide(j);
      else if (d > KEEP_RADIUS) unloadSlide(j);
    }

    const s = slides[i];
    const video = $('video', s);
    if (video.readyState >= 1 && video.currentTime > 0 && !s.dataset.resume) video.currentTime = 0;
    delete s.dataset.resume;
    safePlay(video, s);
    startProgressLoop();
    updateDeskNav();
  }

  function setupObserver() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (e.isIntersecting && e.intersectionRatio >= 0.6) setActive(Number(e.target.dataset.index));
      }
    }, { root: feedEl, threshold: [0.6] });
    slides.forEach(s => observer.observe(s));
  }

  function scrollToIndex(i, smooth = true) {
    const s = slides[i];
    if (!s) return;
    feedEl.scrollTo({ top: s.offsetTop, behavior: smooth ? 'smooth' : 'auto' });
  }

  function startProgressLoop() {
    cancelAnimationFrame(rafId);
    const tick = () => {
      const s = slides[activeIndex];
      if (s && !s.classList.contains('seeking')) {
        const v = $('video', s);
        if (v.duration) $('.progress-fill', s).style.width = (v.currentTime / v.duration * 100) + '%';
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function renderFeed(focusId) {
    // Alte Slides freigeben
    slides.forEach((_, i) => unloadSlide(i));
    if (observer) observer.disconnect();
    feedEl.textContent = '';
    activeIndex = -1;

    visibleVideos = filter === 'following'
      ? allVideos.filter(v => isFollowing(v.user))
      : allVideos.slice();

    if (!visibleVideos.length) {
      const empty = el('div', 'empty');
      empty.innerHTML = filter === 'following'
        ? '<div style="font-size:42px">👥</div><strong>Noch niemandem gefolgt</strong><div>Tippe im Feed auf das „+“ unter einem Profilbild.</div>'
        : '<div style="font-size:42px">🎬</div><strong>Keine Videos</strong><div>Lade über das „+“ unten dein erstes Video hoch.</div>';
      feedEl.append(empty);
      slides = [];
      updateDeskNav();
      return;
    }

    const frag = document.createDocumentFragment();
    slides = visibleVideos.map((v, i) => { const s = createSlide(v, i); frag.append(s); return s; });
    feedEl.append(frag);

    let start = 0;
    if (focusId) { const idx = visibleVideos.findIndex(v => v.id === focusId); if (idx >= 0) start = idx; }
    feedEl.scrollTop = 0;
    requestAnimationFrame(() => {
      scrollToIndex(start, false);
      setupObserver();
      setActive(start);
    });
  }

  function updateDeskNav() {
    $('#prevBtn').disabled = activeIndex <= 0;
    $('#nextBtn').disabled = activeIndex < 0 || activeIndex >= slides.length - 1;
  }

  /* =========================================================
     TAP / DOPPELTIPP / GEDRÜCKT HALTEN
     Einfacher Tipp = Ton an/aus · Doppeltipp = Like
     Gedrückt halten = Pause (solange gehalten)
     ========================================================= */
  function wireTapLayer(slide, layer) {
    const DOUBLE_MS = 280, HOLD_MS = 450, MOVE_TOL = 12;
    let downX = 0, downY = 0, downAt = 0, moved = false, holdTimer = 0, heldPause = false;
    let lastTap = 0, singleTimer = 0;

    layer.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      downX = e.clientX; downY = e.clientY; downAt = performance.now(); moved = false; heldPause = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        const v = $('video', slide);
        if (!v.paused) { v.pause(); heldPause = true; slide.classList.add('paused'); }
      }, HOLD_MS);
    });
    layer.addEventListener('pointermove', e => {
      if (!downAt) return;
      if (Math.abs(e.clientX - downX) > MOVE_TOL || Math.abs(e.clientY - downY) > MOVE_TOL) { moved = true; clearTimeout(holdTimer); }
    });
    const end = e => {
      clearTimeout(holdTimer);
      if (!downAt) return;
      const dur = performance.now() - downAt;
      downAt = 0;
      if (heldPause) {
        heldPause = false;
        safePlay($('video', slide), slide);
        return;
      }
      if (e.type === 'pointercancel' || moved || dur > HOLD_MS) return;

      const now = performance.now();
      if (now - lastTap < DOUBLE_MS) {
        clearTimeout(singleTimer);
        lastTap = 0;
        heartBurst(slide, e.clientX, e.clientY);
        const v = visibleVideos[Number(slide.dataset.index)];
        if (!isLiked(v)) toggleLike(slide, v);
      } else {
        lastTap = now;
        singleTimer = setTimeout(() => { lastTap = 0; toggleMute(slide); }, DOUBLE_MS);
      }
    };
    layer.addEventListener('pointerup', end);
    layer.addEventListener('pointercancel', end);
    layer.addEventListener('contextmenu', e => e.preventDefault());
  }

  function heartBurst(slide, x, y) {
    const r = slide.getBoundingClientRect();
    const h = el('div', 'burst', ICON.heartFilled);
    h.style.left = (x - r.left) + 'px';
    h.style.top = (y - r.top) + 'px';
    h.style.setProperty('--r', (Math.random() * 40 - 20).toFixed(0) + 'deg');
    slide.append(h);
    h.addEventListener('animationend', () => h.remove(), { once: true });
  }

  /* =========================================================
     FORTSCHRITTSBALKEN (Seek)
     ========================================================= */
  function wireProgress(slide, bar, video) {
    let dragging = false;
    const seekTo = clientX => {
      const r = bar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      if (video.duration) {
        video.currentTime = ratio * video.duration;
        $('.progress-fill', slide).style.width = ratio * 100 + '%';
        $('.time-tip', slide).textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    };
    bar.addEventListener('pointerdown', e => {
      e.stopPropagation();
      dragging = true;
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('drag');
      slide.classList.add('seeking');
      seekTo(e.clientX);
    });
    bar.addEventListener('pointermove', e => { if (dragging) seekTo(e.clientX); });
    const stop = () => {
      if (!dragging) return;
      dragging = false;
      bar.classList.remove('drag');
      slide.classList.remove('seeking');
    };
    bar.addEventListener('pointerup', stop);
    bar.addEventListener('pointercancel', stop);
  }

  /* =========================================================
     INTERAKTIONEN
     ========================================================= */
  function applyMute(flash = true, slide = slides[activeIndex]) {
    const m = Store.state.muted;
    slides.forEach(s => { $('video', s).muted = m; });
    $('#muteBtn').innerHTML = m ? ICON.soundOff : ICON.soundOn;
    $('#muteBtn').setAttribute('aria-label', m ? 'Ton einschalten' : 'Ton ausschalten');
    if (flash && slide) {
      const f = $('.center-flash', slide);
      f.innerHTML = m ? ICON.soundOff : ICON.soundOn;
      f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    }
  }

  function toggleMute(slide) {
    Store.state.muted = !Store.state.muted;
    Store.save();
    applyMute(true, slide);
    // Falls das Video wegen Autoplay-Sperre pausiert war: mit Nutzergeste starten.
    const s = slide || slides[activeIndex];
    if (s) { const v = $('video', s); if (v.paused && !s.classList.contains('paused')) safePlay(v, s); }
  }

  function togglePause() {
    const s = slides[activeIndex];
    if (!s) return;
    const v = $('video', s);
    if (v.paused) safePlay(v, s);
    else { v.pause(); s.classList.add('paused'); }
  }

  function toggleLike(slide, v) {
    const liked = !isLiked(v);
    if (liked) Store.state.likes[v.id] = Date.now(); else delete Store.state.likes[v.id];
    Store.save();
    const btn = $('.act.like', slide);
    btn.classList.toggle('on', liked);
    btn.setAttribute('aria-pressed', liked);
    $('.act-count', btn).textContent = formatCount(likeCount(v));
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    if (navigator.vibrate && liked) navigator.vibrate(12);
  }

  function toggleSave(slide, v) {
    const on = !Store.state.saves[v.id];
    if (on) Store.state.saves[v.id] = Date.now(); else delete Store.state.saves[v.id];
    Store.save();
    const btn = $('.act.save', slide);
    btn.classList.toggle('on', on);
    $('.act-count', btn).textContent = on ? 'Gespeichert' : 'Speichern';
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    toast(on ? 'Zu Gespeichert hinzugefügt' : 'Aus Gespeichert entfernt');
  }

  function toggleFollow(v) {
    const on = !isFollowing(v.user);
    if (on) Store.state.follows[v.user] = Date.now(); else delete Store.state.follows[v.user];
    Store.save();
    // Alle Slides desselben Nutzers aktualisieren
    slides.forEach((s, i) => {
      if (visibleVideos[i].user !== v.user) return;
      const fb = $('.follow-btn', s);
      if (!fb) return;
      fb.classList.toggle('on', on);
      fb.innerHTML = on ? ICON.check : ICON.plus;
      fb.setAttribute('aria-label', on ? `@${v.user} entfolgen` : `@${v.user} folgen`);
    });
    toast(on ? `Du folgst jetzt @${v.user}` : `Du folgst @${v.user} nicht mehr`);
  }

  async function share(slide, v) {
    const text = `${v.desc} – @${v.user}`;
    let shared = false;
    try {
      if (v.blob && navigator.canShare) {
        const file = new File([v.blob], v.fileName || 'video.mp4', { type: v.blob.type || 'video/mp4' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); shared = true; }
      }
      if (!shared && navigator.share && !v.blob) {
        await navigator.share({ title: `@${v.user}`, text, url: v.sources[Number($('video', slide).dataset.srcIndex)] || v.sources[0] });
        shared = true;
      }
    } catch (err) {
      if (err.name === 'AbortError') return; // Nutzer hat abgebrochen
    }
    if (!shared) {
      const payload = v.blob ? text : `${text}\n${v.sources[0]}`;
      shared = await copyText(payload);
      toast(shared ? 'In die Zwischenablage kopiert' : 'Teilen nicht möglich');
    }
    if (shared) {
      Store.state.shares[v.id] = (Store.state.shares[v.id] || 0) + 1;
      Store.save();
      $('.act.share .act-count', slide).textContent = formatCount(shareCount(v));
    }
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (_) {
      const ta = el('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  feedEl.addEventListener('click', e => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const slide = target.closest('.slide');
    const v = visibleVideos[Number(slide.dataset.index)];
    switch (target.dataset.action) {
      case 'like': toggleLike(slide, v); break;
      case 'comment': openComments(v, slide); break;
      case 'save': toggleSave(slide, v); break;
      case 'share': share(slide, v); break;
      case 'follow': toggleFollow(v); break;
      case 'expand': target.classList.toggle('expanded'); break;
    }
  });

  /* =========================================================
     SHEETS (gemeinsame Logik inkl. Wisch-zum-Schließen)
     ========================================================= */
  const backdrop = $('#sheetBackdrop');
  let openSheet = null;
  let lastFocus = null;

  function showSheet(sheet) {
    if (openSheet && openSheet !== sheet) hideSheet(openSheet, true);
    lastFocus = document.activeElement;
    openSheet = sheet;
    sheet.style.transform = '';
    sheet.classList.add('open');
    backdrop.classList.add('open');
  }
  function hideSheet(sheet = openSheet, silent = false) {
    if (!sheet) return;
    sheet.classList.remove('open');
    sheet.style.transform = '';
    if (!silent) backdrop.classList.remove('open');
    if (openSheet === sheet) openSheet = null;
    sheet.dispatchEvent(new Event('sheetclose'));
    if (!silent && lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  backdrop.addEventListener('click', () => hideSheet());
  document.querySelectorAll('.sheet').forEach(sheet => {
    $('[data-close]', sheet).addEventListener('click', () => hideSheet(sheet));
    const head = $('[data-drag]', sheet);
    let startY = 0, dy = 0, dragging = false;
    head.addEventListener('pointerdown', e => {
      if (e.target.closest('[data-close]')) return;
      dragging = true; startY = e.clientY; dy = 0;
      head.setPointerCapture(e.pointerId);
      sheet.classList.add('dragging');
    });
    head.addEventListener('pointermove', e => {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      sheet.style.transform = `translate(-50%, ${dy}px)`;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove('dragging');
      if (dy > 110) hideSheet(sheet); else sheet.style.transform = '';
    };
    head.addEventListener('pointerup', end);
    head.addEventListener('pointercancel', end);
  });

  /* =========================================================
     KOMMENTARE
     ========================================================= */
  const commentSheet = $('#commentSheet');
  const commentList = $('#commentList');
  const commentInput = $('#commentInput');
  const commentSend = $('#commentSend');
  let commentCtx = null; // { v, slide }
  const seedBaseTime = Date.now();

  function openComments(v, slide) {
    commentCtx = { v, slide };
    renderComments();
    showSheet(commentSheet);
    if (matchMedia('(hover: hover)').matches) setTimeout(() => commentInput.focus(), 350);
  }

  function renderComments() {
    const { v } = commentCtx;
    const mine = userComments(v).slice().reverse(); // neueste zuerst
    const seed = v.comments.map((c, i) => ({ id: `${v.id}-s${i}`, user: c.user, text: c.text, ts: seedBaseTime - c.ago, likes: c.likes, seed: true }));
    const items = [...mine.map(c => ({ ...c, user: myName(), mine: true, likes: 0 })), ...seed];
    $('#commentTitle').textContent = `${formatCount(items.length)} Kommentar${items.length === 1 ? '' : 'e'}`;
    commentList.textContent = '';
    if (!items.length) {
      const li = el('li', 'c-empty');
      li.textContent = 'Noch keine Kommentare. Sei die erste Person, die kommentiert!';
      commentList.append(li);
      return;
    }
    const frag = document.createDocumentFragment();
    for (const c of items) frag.append(commentItem(c));
    commentList.append(frag);
  }

  function commentItem(c) {
    const li = el('li', 'c-item');
    li.dataset.id = c.id;
    const av = el('div', 'c-avatar'); paintAvatar(av, c.user);
    const main = el('div', 'c-main');
    const name = el('div', 'c-name'); name.textContent = c.user;
    if (c.mine) name.append(el('span', 'me', 'Du'));
    const text = el('div', 'c-text'); text.textContent = c.text;
    const meta = el('div', 'c-meta');
    const t = el('span'); t.textContent = timeAgo(c.ts);
    meta.append(t);
    if (c.mine) {
      const del = el('button'); del.type = 'button'; del.textContent = 'Löschen'; del.dataset.del = c.id;
      meta.append(del);
    }
    main.append(name, text, meta);
    const liked = !!Store.state.commentLikes[c.id];
    const like = el('button', 'c-like' + (liked ? ' on' : ''), liked ? ICON.heartFilled : ICON.heartSmall);
    like.type = 'button';
    like.dataset.clike = c.id;
    like.dataset.base = c.likes;
    like.setAttribute('aria-label', 'Kommentar liken');
    const cnt = el('span'); cnt.textContent = formatCount(c.likes + (liked ? 1 : 0));
    like.append(cnt);
    li.append(av, main, like);
    return li;
  }

  commentList.addEventListener('click', async e => {
    const likeBtn = e.target.closest('[data-clike]');
    if (likeBtn) {
      const id = likeBtn.dataset.clike;
      const on = !Store.state.commentLikes[id];
      if (on) Store.state.commentLikes[id] = 1; else delete Store.state.commentLikes[id];
      Store.save();
      likeBtn.classList.toggle('on', on);
      likeBtn.innerHTML = on ? ICON.heartFilled : ICON.heartSmall;
      const cnt = el('span'); cnt.textContent = formatCount(Number(likeBtn.dataset.base) + (on ? 1 : 0));
      likeBtn.append(cnt);
      return;
    }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn && commentCtx) {
      if (!(await confirmDialog('Diesen Kommentar löschen?'))) return;
      const { v } = commentCtx;
      Store.state.comments[v.id] = userComments(v).filter(c => c.id !== delBtn.dataset.del);
      if (!Store.state.comments[v.id].length) delete Store.state.comments[v.id];
      delete Store.state.commentLikes[delBtn.dataset.del];
      Store.save();
      renderComments();
      updateCommentCount();
    }
  });

  function updateCommentCount() {
    const { v, slide } = commentCtx;
    if (slide.isConnected) $('.act.comment .act-count', slide).textContent = formatCount(commentCount(v));
  }

  function autoGrow() {
    commentInput.style.height = 'auto';
    commentInput.style.height = Math.min(commentInput.scrollHeight, 120) + 'px';
    commentSend.disabled = !commentInput.value.trim();
  }
  commentInput.addEventListener('input', autoGrow);
  commentInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#commentForm').requestSubmit(); }
  });
  $('#commentForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = commentInput.value.trim();
    if (!text || !commentCtx) return;
    const { v } = commentCtx;
    (Store.state.comments[v.id] ||= []).push({ id: uid(), text, ts: Date.now() });
    Store.save();
    commentInput.value = '';
    autoGrow();
    renderComments();
    updateCommentCount();
    $('.sheet-body', commentSheet).scrollTop = 0;
  });
  commentSheet.addEventListener('sheetclose', () => { commentInput.blur(); });

  /* =========================================================
     UPLOAD
     ========================================================= */
  const uploadSheet = $('#uploadSheet');
  const uploadForm = $('#uploadForm');
  const fileInput = $('#fileInput');
  const dropZone = $('#dropZone');
  const previewVideo = $('#previewVideo');
  const publishBtn = $('#publishBtn');
  const MAX_BYTES = 1024 ** 3; // 1 GB pro Video
  let pendingFile = null;
  let previewUrl = null;
  let dbAvailable = true;

  function resetUpload() {
    pendingFile = null;
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    previewVideo.removeAttribute('src');
    previewVideo.load();
    uploadForm.reset();
    uploadForm.classList.remove('has-file');
    $('#fileMeta').textContent = '';
    $('#descCount').textContent = '0/300';
    publishBtn.disabled = true;
    publishBtn.textContent = 'Veröffentlichen';
  }

  function openUpload() {
    resetUpload();
    $('#upMusic').placeholder = `Originalton – ${myName()}`;
    showSheet(uploadSheet);
    // Aktives Video pausieren, damit die Vorschau nicht konkurriert
    const s = slides[activeIndex];
    if (s) $('video', s).pause();
  }
  uploadSheet.addEventListener('sheetclose', () => {
    previewVideo.pause();
    const s = slides[activeIndex];
    if (s && !openSheet && !s.classList.contains('paused')) safePlay($('video', s), s);
  });

  function acceptFile(file) {
    if (!file) return;
    if (!file.type.startsWith('video/') && !/\.(mp4|m4v|webm|mov)$/i.test(file.name)) { toast('Bitte eine Videodatei auswählen'); return; }
    if (file.size > MAX_BYTES) { toast(`Datei zu groß (max. ${formatBytes(MAX_BYTES)})`); return; }
    const probeUrl = URL.createObjectURL(file);
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.muted = true;
    probe.onloadedmetadata = () => {
      pendingFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = probeUrl;
      previewVideo.src = previewUrl;
      previewVideo.play().catch(() => {});
      uploadForm.classList.add('has-file');
      const dims = probe.videoWidth ? ` · ${probe.videoWidth}×${probe.videoHeight}` : '';
      $('#fileMeta').textContent = `${file.name} · ${formatBytes(file.size)} · ${formatTime(probe.duration)}${dims}`;
      publishBtn.disabled = false;
      probe.removeAttribute('src');
    };
    probe.onerror = () => {
      URL.revokeObjectURL(probeUrl);
      toast('Dieses Videoformat wird von deinem Browser nicht unterstützt');
    };
    probe.src = probeUrl;
  }

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  $('#changeFile').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { acceptFile(fileInput.files[0]); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach(t => dropZone.addEventListener(t, e => { e.preventDefault(); dropZone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => dropZone.addEventListener(t, e => { e.preventDefault(); dropZone.classList.remove('over'); }));
  dropZone.addEventListener('drop', e => acceptFile(e.dataTransfer.files[0]));
  $('#upDesc').addEventListener('input', e => { $('#descCount').textContent = `${e.target.value.length}/300`; });

  uploadForm.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pendingFile) return;
    publishBtn.disabled = true;
    publishBtn.textContent = 'Wird gespeichert …';
    const rec = {
      id: 'up-' + uid(),
      blob: pendingFile,
      name: pendingFile.name,
      desc: $('#upDesc').value.trim(),
      music: $('#upMusic').value.trim() || `Originalton – ${myName()}`,
      createdAt: Date.now()
    };
    try {
      if (dbAvailable) {
        await VideoDB.put(rec);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      }
    } catch (err) {
      console.error(err);
      const quota = err && err.name === 'QuotaExceededError';
      toast(quota ? 'Nicht genug Speicherplatz im Browser' : 'Speichern fehlgeschlagen – Video nur bis zum Neuladen sichtbar');
      if (quota) { publishBtn.disabled = false; publishBtn.textContent = 'Veröffentlichen'; return; }
    }
    if (!dbAvailable) toast('Kein dauerhafter Speicher verfügbar – Video nur bis zum Neuladen sichtbar');
    allVideos.unshift(uploadToVideo(rec));
    hideSheet(uploadSheet);
    resetUpload();
    filter = 'all';
    syncTabs();
    renderFeed(rec.id);
    toast('Video veröffentlicht 🎉');
  });

  /* =========================================================
     PROFIL
     ========================================================= */
  const profileSheet = $('#profileSheet');
  const profileName = $('#profileName');

  function gridItem(v, deletable) {
    const item = el('div', 'grid-item');
    item.dataset.id = v.id;
    const vid = el('video');
    vid.muted = true; vid.preload = 'metadata'; vid.playsInline = true;
    vid.addEventListener('loadedmetadata', () => { vid.currentTime = Math.min(0.5, (vid.duration || 1) / 2); }, { once: true });
    vid.onerror = () => vid.remove();
    vid.src = v.sources[0];
    const likes = el('div', 'g-likes', ICON.heartFilled);
    const n = el('span'); n.textContent = formatCount(likeCount(v));
    likes.append(n);
    item.append(vid, likes);
    if (deletable) {
      const del = el('button', 'g-del', ICON.trash);
      del.type = 'button';
      del.dataset.del = v.id;
      del.setAttribute('aria-label', 'Video löschen');
      item.append(del);
    }
    return item;
  }

  async function renderProfile() {
    paintAvatar($('#profileAvatar'), myName());
    profileName.value = myName();
    const mine = allVideos.filter(v => v.own);
    const saved = allVideos.filter(v => Store.state.saves[v.id]);
    $('#statVideos').textContent = mine.length;
    $('#statFollowing').textContent = Object.keys(Store.state.follows).length;
    $('#statLikes').textContent = Object.keys(Store.state.likes).length;

    const myGrid = $('#myGrid'); myGrid.textContent = '';
    if (mine.length) mine.forEach(v => myGrid.append(gridItem(v, true)));
    else myGrid.append(el('div', 'grid-empty', 'Du hast noch keine Videos hochgeladen.<br>Tippe unten auf „+“.'));

    const savedGrid = $('#savedGrid'); savedGrid.textContent = '';
    if (saved.length) saved.forEach(v => savedGrid.append(gridItem(v, false)));
    else savedGrid.append(el('div', 'grid-empty', 'Noch nichts gespeichert.'));

    const info = $('#storageInfo');
    info.textContent = dbAvailable ? 'Videos werden lokal in diesem Browser gespeichert (IndexedDB).' : 'IndexedDB nicht verfügbar – Uploads gehen beim Neuladen verloren.';
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const { usage, quota } = await navigator.storage.estimate();
        if (quota) info.textContent += ` Belegt: ${formatBytes(usage || 0)} von ca. ${formatBytes(quota)}.`;
      } catch (_) { /* optional */ }
    }
  }

  function openProfile() {
    renderProfile();
    showSheet(profileSheet);
    $('#navProfile').classList.add('active');
    $('#navHome').classList.remove('active');
  }
  profileSheet.addEventListener('sheetclose', () => {
    $('#navProfile').classList.remove('active');
    $('#navHome').classList.add('active');
    // Grid-Videos entladen
    profileSheet.querySelectorAll('.grid-item video').forEach(v => { v.removeAttribute('src'); v.load(); });
  });

  profileName.addEventListener('change', () => {
    const clean = profileName.value.trim().replace(/\s+/g, '_').replace(/[^\p{L}\p{N}_.]/gu, '').slice(0, 24);
    if (!clean) { profileName.value = myName(); return; }
    Store.state.profile.name = clean;
    Store.save();
    profileName.value = clean;
    paintAvatar($('#profileAvatar'), clean);
    allVideos.forEach(v => { if (v.own) { v.user = clean; if (v.music.startsWith('Originalton – ')) v.music = `Originalton – ${clean}`; } });
    toast('Name gespeichert');
    const currentId = visibleVideos[activeIndex] && visibleVideos[activeIndex].id;
    renderFeed(currentId);
  });
  profileName.addEventListener('keydown', e => { if (e.key === 'Enter') profileName.blur(); });

  async function deleteUpload(id) {
    if (!(await confirmDialog('Dieses Video endgültig von diesem Gerät löschen?'))) return;
    try { if (dbAvailable) await VideoDB.remove(id); }
    catch (err) { console.error(err); toast('Löschen fehlgeschlagen'); return; }
    const url = objectUrls.get(id);
    allVideos = allVideos.filter(v => v.id !== id);
    delete Store.state.likes[id]; delete Store.state.saves[id]; delete Store.state.comments[id]; delete Store.state.shares[id];
    Store.save();
    const currentId = visibleVideos[activeIndex] && visibleVideos[activeIndex].id;
    renderFeed(currentId === id ? undefined : currentId);
    if (url) { URL.revokeObjectURL(url); objectUrls.delete(id); }
    renderProfile();
    toast('Video gelöscht');
  }

  profileSheet.addEventListener('click', e => {
    const del = e.target.closest('.g-del');
    if (del) { e.stopPropagation(); deleteUpload(del.dataset.del); return; }
    const item = e.target.closest('.grid-item');
    if (item) {
      hideSheet(profileSheet);
      if (filter !== 'all') { filter = 'all'; syncTabs(); renderFeed(item.dataset.id); return; }
      const idx = visibleVideos.findIndex(v => v.id === item.dataset.id);
      if (idx >= 0) scrollToIndex(idx);
    }
  });

  $('#resetBtn').addEventListener('click', async () => {
    if (!(await confirmDialog('Alle Likes, Kommentare, Follows und hochgeladenen Videos löschen?', 'Alles löschen'))) return;
    try { if (dbAvailable) await VideoDB.clear(); } catch (err) { console.error(err); }
    Store.clear();
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls.clear();
    location.reload();
  });

  /* =========================================================
     NAVIGATION, TABS, TASTATUR
     ========================================================= */
  function syncTabs() {
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.filter === filter;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on);
    });
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    if (t.dataset.filter === filter) return;
    filter = t.dataset.filter;
    syncTabs();
    renderFeed();
  }));

  $('#muteBtn').addEventListener('click', () => toggleMute());
  $('#navUpload').addEventListener('click', openUpload);
  $('#navProfile').addEventListener('click', openProfile);
  $('#navHome').addEventListener('click', () => {
    hideSheet();
    if (activeIndex > 0) scrollToIndex(0);
  });
  $('#prevBtn').addEventListener('click', () => scrollToIndex(activeIndex - 1));
  $('#nextBtn').addEventListener('click', () => scrollToIndex(activeIndex + 1));

  document.addEventListener('keydown', e => {
    if ($('#confirm').classList.contains('open')) { if (e.key === 'Escape') $('#confirmNo').click(); return; }
    if (e.key === 'Escape' && openSheet) { hideSheet(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || openSheet || e.metaKey || e.ctrlKey || e.altKey) return;
    const s = slides[activeIndex];
    switch (e.key) {
      case 'ArrowDown': case 'PageDown': case 'j': e.preventDefault(); scrollToIndex(activeIndex + 1); break;
      case 'ArrowUp': case 'PageUp': case 'k': e.preventDefault(); scrollToIndex(activeIndex - 1); break;
      case ' ': e.preventDefault(); togglePause(); break;
      case 'm': case 'M': toggleMute(); break;
      case 'l': case 'L': if (s) toggleLike(s, visibleVideos[activeIndex]); break;
      case 'c': case 'C': if (s) openComments(visibleVideos[activeIndex], s); break;
      case 'ArrowRight': if (s) { const v = $('video', s); v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); } break;
      case 'ArrowLeft': if (s) { const v = $('video', s); v.currentTime = Math.max(0, v.currentTime - 5); } break;
    }
  });

  // Im Hintergrund pausieren, beim Zurückkehren fortsetzen.
  document.addEventListener('visibilitychange', () => {
    const s = slides[activeIndex];
    if (!s) return;
    const v = $('video', s);
    if (document.hidden) { v.pause(); cancelAnimationFrame(rafId); }
    else if (!s.classList.contains('paused') && openSheet !== uploadSheet) { safePlay(v, s); startProgressLoop(); }
  });

  // Nach Größenänderung (z. B. Drehen) am aktiven Video einrasten.
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (activeIndex >= 0) scrollToIndex(activeIndex, false); }, 120);
  });

  /* =========================================================
     START
     ========================================================= */
  async function init() {
    Store.load();
    applyMute(false);
    let uploads = [];
    dbAvailable = await VideoDB.available();
    if (dbAvailable) {
      try { uploads = (await VideoDB.getAll()) || []; }
      catch (err) { console.error(err); toast('Gespeicherte Videos konnten nicht geladen werden'); }
    }
    uploads.sort((a, b) => b.createdAt - a.createdAt);
    allVideos = [...uploads.map(uploadToVideo), ...SEED_VIDEOS];
    renderFeed();
  }

  init();
})();
</script>
</body>
</html>
